name: Sync component chart

on:
  repository_dispatch:
    types: [component-chart-sync]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component name (e.g. dns-operator)'
        required: true
        type: string
      ref:
        description: 'Source ref from the component repo (e.g. main, release-v1.5)'
        required: true
        type: string

env:
  MIN_RELEASE_VERSION: "1.5"

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-targets:
    name: Find target branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.find.outputs.branches }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Set component and ref
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "component=${{ github.event.client_payload.component }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "component=${{ inputs.component }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find matching branches
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCHES=$(./hack/sync-components/find-target-branches.sh \
            "${{ github.repository }}" \
            "${{ steps.params.outputs.component }}" \
            "${{ steps.params.outputs.ref }}" \
            "${{ env.MIN_RELEASE_VERSION }}")
          echo "Matching branches: $BRANCHES"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync ${{ matrix.target.branch }}
    needs: resolve-targets
    if: needs.resolve-targets.outputs.branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-targets.outputs.branches) }}
    steps:
      - name: Set params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "component=${{ github.event.client_payload.component }}" >> "$GITHUB_OUTPUT"
            echo "actor=${{ github.event.client_payload.actor }}" >> "$GITHUB_OUTPUT"
            echo "commit-url=${{ github.event.client_payload.commit-url }}" >> "$GITHUB_OUTPUT"
          else
            echo "component=${{ inputs.component }}" >> "$GITHUB_OUTPUT"
            echo "actor=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "commit-url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with:
          ref: ${{ matrix.target.branch }}
          token: ${{ secrets.KUADRANT_DEV_PAT }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync chart
        run: make sync-component-chart COMPONENT=${{ steps.params.outputs.component }}

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # ratchet:peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          commit-message: "chore: sync ${{ steps.params.outputs.component }} chart"
          signoff: true
          sign-commits: true
          base: ${{ matrix.target.branch }}
          branch: sync/${{ matrix.target.branch }}/${{ steps.params.outputs.component }}
          delete-branch: true
          title: "chore: sync ${{ steps.params.outputs.component }} chart"
          body: |
            Automated sync of the ${{ steps.params.outputs.component }} Helm chart.

            Triggered by @${{ steps.params.outputs.actor }}${{ steps.params.outputs.commit-url && format(' via [{0}]({0})', steps.params.outputs.commit-url) || '' }}

            [Recent upstream commits](https://github.com/Kuadrant/${{ steps.params.outputs.component }}/commits/)

            Auto-generated by [sync-component-chart](https://github.com/${{ github.repository }}/actions/workflows/sync-component-chart.yaml)

      - name: Enable auto-merge
        if: matrix.target.auto-merge == true && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.KUADRANT_DEV_PAT }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} \
            --auto --squash --repo ${{ github.repository }}
