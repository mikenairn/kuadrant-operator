# Automatically approves chart sync PRs created by the kuadrant-dev bot.
# Guards ensure only PRs matching all of the following are approved:
#   - Originates from the same repo (not a fork)
#   - Head branch matches the sync/* naming convention
#   - Author is kuadrant-dev
#   - Title starts with chore(deps)

name: Auto-approve sync chart PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - 'release-*'

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'sync/') &&
      github.event.pull_request.user.login == 'mikenairn' &&
      startsWith(github.event.pull_request.title, 'chore(deps)')
    permissions:
      pull-requests: write
    steps:
      - name: Generate approver token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APPROVER_APP_ID }}
          private-key: ${{ secrets.SYNC_APPROVER_APP_PRIVATE_KEY }}

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" --approve --repo "$REPO" \
            --body "Auto-approved: automated chart sync PR."
